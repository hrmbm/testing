<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#016172">
  <title>Portal Karir</title>
</head>
<body>
  <main style="font:16px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;color:#016172">
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang dibuka tidak tersedia.</p>
    <p><a id="home-link" href="./">Kembali ke Portal Karir</a></p>
  </main>
  <script>
    // Kompatibilitas tautan lama /tahap-1/ s.d. /tahap-4/ tanpa empat folder redirect.
    const routeMap = {
      'tahap-1': 'apply',
      'tahap-2': 'form',
      'tahap-3': 'disc',
      'tahap-4': 'spm',
      'disc': 'disc'
    };
    const parts = location.pathname.split('/').filter(Boolean);
    const routeIndex = parts.findIndex(part => Object.hasOwn(routeMap, part));
    if (routeIndex >= 0) {
      const prefixParts = parts.slice(0, routeIndex);
      const prefix = prefixParts.length ? '/' + prefixParts.join('/') : '';
      const target = `${prefix}/${routeMap[parts[routeIndex]]}/`;
      location.replace(target + location.search + location.hash);
    } else {
      const firstPage = parts.length ? `/${parts[0]}/` : '/';
      document.getElementById('home-link').href = firstPage;
    }
  </script>
</body>
</html>
