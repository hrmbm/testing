<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="pk-build" content="20261122-lowongan-v5"><meta name="theme-color" content="#016172"><title>Lamaran Kerja · Mitra Binamandiri Makmur</title><link rel="stylesheet" href="../assets/css/app.css?v=20261122-lowongan-v5"><style>
    :root{--ink:#172033;--muted:#687386;--line:#e6eaf0;--brand:#174a75;--brand2:#236b9b;--bg:#f4f7fb;--white:#fff;--good:#137a55;--bad:#a34b36}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:560px;margin:0 auto;padding:20px 15px 38px}
    .top{padding:24px 21px;background:linear-gradient(135deg,#123d63,#236b9b);border-radius:20px;color:#fff;box-shadow:0 12px 28px #163f6422}
    .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.78;font-weight:700}
    h1{font-size:23px;line-height:1.2;margin:8px 0 6px;font-weight:750}
    .progress{height:5px;background:#e7edf3;border-radius:9px;margin:20px 2px 17px;overflow:hidden}
    .bar{height:100%;width:0;background:#4b9bcb;transition:width .25s}
    .stepmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:0 2px 8px}
    .card{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:20px 17px;box-shadow:0 5px 18px #18283d08}
    .section-title{font-size:17px;font-weight:750;margin:0 0 14px}
    .field{margin:0 0 16px}
    label,.legend{display:block;font-size:13px;font-weight:650;margin:0 0 8px}
    input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;border:1px solid #dce2ea;border-radius:11px;padding:13px 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff;outline:none}
    input[type=number]{font-variant-numeric:tabular-nums}
    input:focus,select:focus,textarea:focus{border-color:#4788b5;box-shadow:0 0 0 3px #4788b51c}
    textarea{min-height:94px;resize:vertical}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .opt{position:relative}
    .opt input{position:absolute;opacity:0;pointer-events:none}
    .opt span{display:flex;align-items:center;justify-content:center;min-height:45px;border:1px solid #dce2ea;border-radius:11px;padding:10px;text-align:center;font-size:13px;font-weight:600;color:#455267;cursor:pointer;background:#fff}
    .opt input:checked+span{border-color:#286b99;background:#edf5fb;color:#174a75;box-shadow:inset 0 0 0 1px #286b99}
    .confirm-box{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;background:#f8fafc;border:1px solid #dce2ea;border-radius:11px;cursor:pointer;margin:0}
    .confirm-box input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);cursor:pointer;flex-shrink:0}
    .confirm-box span{font-size:13px;font-weight:500;line-height:1.45;color:var(--ink)}
    .filebox{border:1.5px dashed #cbd5e1;background:#f9fbfd;border-radius:12px;padding:16px;text-align:center}
    .filebox input{width:100%;font-size:12px}
    .filehint{font-size:11px;color:var(--muted);margin-top:7px}
    .actions{display:flex;gap:10px;margin-top:20px}
    button{border:0;border-radius:12px;padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer}
    .primary{background:var(--brand);color:#fff;flex:1}
    .secondary{background:#eef2f6;color:#3e4a5c}
    button:disabled{opacity:.55;cursor:wait}
    .error{display:none;margin:0 0 13px;padding:11px 12px;border-radius:10px;background:#fff0ed;color:#963e2c;font-size:12px;line-height:1.45}
    .success{text-align:center;padding:26px 12px}
    .success .symbol{width:54px;height:54px;border-radius:50%;background:#e7f6ef;color:var(--good);display:grid;place-items:center;font-size:27px;margin:0 auto 14px}
    .success h2{font-size:20px;margin:0 0 8px}
    .success p{font-size:13px;line-height:1.55;color:var(--muted)}
    .status{display:inline-block;margin:8px 0;padding:7px 11px;border-radius:20px;background:#eaf5ef;color:#176b4d;font-size:11px;font-weight:750}
    .wa{display:block;text-decoration:none;background:#17865a;color:#fff;padding:14px;border-radius:12px;font-size:14px;font-weight:750;margin-top:17px}
    .foot{text-align:center;color:#9aa4b2;font-size:10px;margin:17px 0 0}
    .hidden{display:none!important}
    @media(min-width:500px){.wrap{padding-top:30px}.top{padding:27px 24px}}
    .apply-shell{min-height:100vh;padding:22px 12px;background:#f3f5f8}.apply-shell .wrap{max-width:680px;margin:0 auto}.apply-shell .top{background:linear-gradient(135deg,#17243a,#294568)}.apply-shell .primary{background:#3b68d8}.apply-shell .foot{color:#96a2b2}@media(min-width:900px){.apply-shell .wrap{max-width:760px}.apply-shell .top{padding:30px}}
  </style><link rel="stylesheet" href="../assets/css/mitra-theme.css?v=20261122-lowongan-v5"></head><body><div class="apply-shell">
  <div class="wrap">
    <header class="top">
      <div class="apply-brand"><img class="brand-logo" src="../assets/img/logo-mitra.png" alt="PT. Mitra Binamandiri Makmur"><span>PORTAL REKRUTMEN<small>PT. MITRA BINAMANDIRI MAKMUR</small></span></div>
      <h1>Formulir Lamaran Kerja</h1>
    </header>

    <div id="formArea">
      <div class="stepmeta"><span id="stepLabel">Data kandidat</span><span id="stepCount">1 / 3</span></div>
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="card">
        <div id="errorBox" class="error"></div>
        <form id="applicationForm">
          <section class="step" data-title="Data kandidat">
            <h2 class="section-title">Data kandidat</h2>
            <div id="step1Fields"></div>
          </section>

          <section class="step hidden" data-title="Pengalaman kerja">
            <h2 class="section-title">Pengalaman kerja</h2>
            <div id="dynamicFields"></div>
          </section>

          <section class="step hidden" data-title="CV &amp; konfirmasi">
            <h2 class="section-title">CV & konfirmasi</h2>
            <div class="field">
              <label for="cv">Upload CV</label>
              <div class="filebox">
                <input id="cv" type="file" accept=".pdf,.doc,.docx" required>
                <div class="filehint">PDF, DOC, DOCX · Maks. 5 MB</div>
              </div>
            </div>
            <div class="field">
              <label class="confirm-box" for="confirm">
                <input id="confirm" type="checkbox" required>
                <span>Saya menyatakan data yang saya isi benar dan dapat dipertanggungjawabkan.</span>
              </label>
            </div>
          </section>

          <div class="actions" id="navActions">
            <button type="button" class="secondary hidden" id="backBtn">Kembali</button>
            <button type="button" class="primary" id="nextBtn">Lanjutkan</button>
            <button type="submit" class="primary hidden" id="submitBtn">Kirim lamaran</button>
          </div>
        </form>
      </div>
    </div>

    <div id="resultArea" class="card hidden">
      <div class="success">
        <div class="symbol" id="resultSymbol">✓</div>
        <h2 id="resultTitle">Lamaran tersimpan</h2>
        <div id="resultStatus" class="status"></div>
        <p id="resultMessage"></p>
        <a id="waLink" class="wa hidden" target="_blank" rel="noopener noreferrer">Kirim ke WhatsApp HR · 08133193313</a>
      </div>
    </div>
    <p class="foot">Mitra Binamandiri Makmur</p>
  </div>
</div><script type="module">
  if ('caches' in window) {
    try {
      const names = await caches.keys();
      await Promise.all(names
        .filter(n => n.startsWith('portal-karir-app-') && n !== 'portal-karir-app-assets-20261122-lowongan-v5')
        .map(n => caches.delete(n)));
    } catch {}
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update().catch(() => {}))).catch(() => {});
  }

  import {
    DISTRICTS_BY_CITY,
    APPLY_INFO_SOURCES,
    DEFAULT_VACANCIES,
    normalizeVacancyList,
    calculateCandidateScore
  } from '../assets/js/vacancy-logic.js?v=20261122-lowongan-v5';
  import {
    DEFAULT_APPLY_SCHEMA,
    normalizeApplySchema
  } from '../assets/js/form-schema.js?v=20261122-lowongan-v5';

  const form = document.getElementById('applicationForm');
  const steps = [...document.querySelectorAll('.step')];
  let current = 0;
  let activeVacancies = [];
  let applySchema = normalizeApplySchema(DEFAULT_APPLY_SCHEMA);
  const $ = id => document.getElementById(id);
  const HR_WHATSAPP_NUMBER = '628133193313';

  const escapeHtml = value =>
    String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));

  function formatWhatsAppValue(value) {
    if (Array.isArray(value)) return value.filter(Boolean).join(', ') || '—';
    if (value === null || value === undefined || String(value).trim() === '') return '—';
    return String(value).trim();
  }

  function buildStage1WhatsAppUrl(payload, vacancy, scoring, fileName, cvUrl, reference) {
    const labelMap = new Map((vacancy?.questions || []).map(q => [q.id, q.label]));
    for (const f of applySchema.fields || []) {
      if (!f.system) labelMap.set(f.id, f.label);
    }
    const detailLines = Object.entries(payload.details || {})
      .filter(([, value]) => Array.isArray(value) ? value.length > 0 : String(value ?? '').trim() !== '')
      .map(([key, value]) => `• ${labelMap.get(key) || key}: ${formatWhatsAppValue(value)}`);
    const message = [
      'LAMARAN KERJA · TAHAP 1',
      'PT. MITRA BINAMANDIRI MAKMUR',
      '',
      `Nama kandidat: ${payload.name}`,
      `Posisi dilamar: ${payload.position}`,
      ...(payload.source ? [`Sumber Informasi: ${payload.source}`] : []),
      `Kabupaten/Kota: ${payload.city}`,
      `Kecamatan: ${payload.district || '—'}`,
      `WhatsApp kandidat: ${payload.whatsapp}`,
      `Skor awal: ${scoring.percentageScore} / 100 (${scoring.totalScore} / ${scoring.maxScore})`,
      '',
      'PENGALAMAN KERJA',
      ...(detailLines.length ? detailLines : ['• —']),
      '',
      `CV: ${fileName}`,
      cvUrl ? `Tautan CV: ${cvUrl}` : 'CV tersimpan di Portal Rekrutmen.',
      `Referensi: ${reference}`
    ];
    return `https://wa.me/${HR_WHATSAPP_NUMBER}?text=${encodeURIComponent(message.join('\n'))}`;
  }

  function renderStep1Field(field, idx) {
    const isReq = field.required !== false;
    const reqAttr = isReq ? 'required' : '';
    const reqMark = isReq ? '<span class="req-mark" aria-hidden="true">*</span>' : '';
    if (field.type === 'system_position') {
      return `<div class="field">
        <label for="position">${escapeHtml(field.label)}<span class="req-mark" aria-hidden="true">*</span></label>
        <select id="position" required>
          <option value="">${escapeHtml(field.placeholder || 'Pilih posisi')}</option>
          ${activeVacancies.map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)}</option>`).join('')}
        </select>
      </div>`;
    }
    if (field.type === 'system_source') {
      const opts = field.options?.length ? field.options : APPLY_INFO_SOURCES;
      return `<div class="field">
        <label for="infoSource">${escapeHtml(field.label)}${reqMark}</label>
        <select id="infoSource" ${reqAttr}>
          <option value="">${escapeHtml(field.placeholder || 'Pilih sumber informasi')}</option>
          ${opts.map(src => `<option value="${escapeHtml(src)}">${escapeHtml(src)}</option>`).join('')}
        </select>
      </div>`;
    }
    if (field.id === 'name') {
      return `<div class="field">
        <label for="name">${escapeHtml(field.label)}<span class="req-mark" aria-hidden="true">*</span></label>
        <input id="name" type="text" minlength="2" maxlength="100" placeholder="${escapeHtml(field.placeholder || 'Nama sesuai identitas')}" required>
      </div>`;
    }
    if (field.type === 'system_location') {
      return `
        <div class="field">
          <label for="city">Kabupaten / Kota${reqMark}</label>
          <select id="city" data-loc-required="${isReq ? 'true' : 'false'}" ${reqAttr}>
            <option value="">${escapeHtml(field.placeholder || 'Pilih wilayah')}</option>
            <option>Pasuruan</option><option>Sidoarjo</option><option>Mojokerto</option><option>Malang</option><option>Area lain</option>
          </select>
        </div>
        <div class="field" id="districtSelectWrap">
          <label for="district">Kecamatan${reqMark}</label><select id="district" ${reqAttr}><option value="">Pilih kecamatan</option></select>
        </div>
        <div class="field hidden" id="districtOtherWrap">
          <label for="districtOther">Kecamatan / wilayah tempat tinggal${reqMark}</label><input id="districtOther" type="text" placeholder="Tulis kecamatan / wilayah">
        </div>`;
    }
    if (field.id === 'whatsapp') {
      return `<div class="field">
        <label for="whatsapp">${escapeHtml(field.label)}${reqMark}</label>
        <input id="whatsapp" type="tel" maxlength="20" placeholder="${escapeHtml(field.placeholder || 'Contoh: 081234567890')}" ${reqAttr}>
      </div>`;
    }

    const inputId = `s1_custom_${idx}`;
    const customAttrs = `data-s1-id="${escapeHtml(field.id)}" data-s1-type="${escapeHtml(field.type)}"`;

    if (field.type === 'dropdown') {
      const opts = (field.options || [])
        .map(opt => `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`)
        .join('');
      return `<div class="field">
        <label for="${inputId}">${escapeHtml(field.label)}${reqMark}</label>
        <select id="${inputId}" ${customAttrs} ${reqAttr}>
          <option value="">${escapeHtml(field.placeholder || 'Pilih')}</option>
          ${opts}
        </select>
      </div>`;
    }
    if (field.type === 'radio') {
      const opts = (field.options || [])
        .map(opt => `<label class="opt">
          <input type="radio" name="${inputId}" value="${escapeHtml(opt)}" data-s1-id="${escapeHtml(field.id)}">
          <span>${escapeHtml(opt)}</span>
        </label>`)
        .join('');
      return `<div class="field" data-q-radio-group="${escapeHtml(field.id)}" data-q-required="${isReq ? 'true' : 'false'}" data-q-label="${escapeHtml(field.label)}">
        <div class="legend">${escapeHtml(field.label)}${reqMark}</div>
        <div class="options">${opts}</div>
      </div>`;
    }
    if (field.type === 'checkbox') {
      const opts = (field.options || [])
        .map(opt => `<label class="opt">
          <input type="checkbox" name="${inputId}" value="${escapeHtml(opt)}" data-s1-id="${escapeHtml(field.id)}">
          <span>${escapeHtml(opt)}</span>
        </label>`)
        .join('');
      return `<div class="field" data-q-checkbox-group="${escapeHtml(field.id)}" data-q-required="${isReq ? 'true' : 'false'}" data-q-label="${escapeHtml(field.label)}">
        <div class="legend">${escapeHtml(field.label)}${reqMark}</div>
        <div class="options">${opts}</div>
      </div>`;
    }
    if (field.type === 'textarea') {
      return `<div class="field">
        <label for="${inputId}">${escapeHtml(field.label)}${reqMark}</label>
        <textarea id="${inputId}" ${customAttrs} maxlength="1200" placeholder="${escapeHtml(field.placeholder || '')}" ${reqAttr}></textarea>
      </div>`;
    }
    if (field.type === 'number') {
      return `<div class="field">
        <label for="${inputId}">${escapeHtml(field.label)}${reqMark}</label>
        <input id="${inputId}" type="number" step="any" ${customAttrs} placeholder="${escapeHtml(field.placeholder || '')}" ${reqAttr}>
      </div>`;
    }
    return `<div class="field">
      <label for="${inputId}">${escapeHtml(field.label)}${reqMark}</label>
      <input id="${inputId}" type="text" ${customAttrs} maxlength="180" placeholder="${escapeHtml(field.placeholder || '')}" ${reqAttr}>
    </div>`;
  }

  function renderStep1Fields() {
    const visibleFields = applySchema.fields.filter(f => f.enabled !== false);
    $('step1Fields').innerHTML = visibleFields.map((f, idx) => renderStep1Field(f, idx)).join('');

    $('city')?.addEventListener('change', () => {
      const cityEl = $('city');
      const city = cityEl.value;
      const locRequired = cityEl.dataset.locRequired === 'true';
      $('district').innerHTML = '<option value="">Pilih kecamatan</option>';
      if (city === 'Area lain') {
        $('districtSelectWrap').classList.add('hidden');
        $('districtOtherWrap').classList.remove('hidden');
        $('districtOther').required = locRequired;
        $('district').required = false;
      } else {
        $('districtSelectWrap').classList.remove('hidden');
        $('districtOtherWrap').classList.add('hidden');
        $('districtOther').required = false;
        $('district').required = locRequired;
        (DISTRICTS_BY_CITY[city] || []).forEach(name => {
          const o = document.createElement('option');
          o.value = name;
          o.textContent = name;
          $('district').appendChild(o);
        });
      }
    });

    $('position')?.addEventListener('change', renderDynamicFields);
  }

  async function loadVacanciesAndSchema() {
    const [vacRes, schemaRes, sbSettings] = await Promise.all([
      fetch('/api/vacancies', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
      fetch('/api/apply-schema', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
      (async () => {
        try {
          const { supabase } = await import('../assets/js/supabase.js?v=20261122-lowongan-v5');
          if (!supabase) return {};
          const { data, error } = await supabase
            .from('portal_settings')
            .select('key,value')
            .in('key', ['job_vacancies_config', 'apply_form_schema']);
          if (error) return {};
          return Object.fromEntries((data || []).map(row => [row.key, row.value]));
        } catch {
          return {};
        }
      })()
    ]);

    const sbVac = Array.isArray(sbSettings?.job_vacancies_config) && sbSettings.job_vacancies_config.length
      ? sbSettings.job_vacancies_config
      : null;
    const apiVac = Array.isArray(vacRes?.vacancies) && vacRes.vacancies.length ? vacRes.vacancies : null;
    const rawVacancies = normalizeVacancyList(
      (vacRes?.customized === true && apiVac)
        ? apiVac
        : (sbVac || apiVac || DEFAULT_VACANCIES)
    );
    activeVacancies = rawVacancies.filter(v => v.active !== false);
    if (!activeVacancies.length) activeVacancies = normalizeVacancyList(DEFAULT_VACANCIES);

    const sbApply = sbSettings?.apply_form_schema && typeof sbSettings.apply_form_schema === 'object'
      ? sbSettings.apply_form_schema
      : null;
    const rawApply = (schemaRes?.customized === true && schemaRes?.schema)
      ? schemaRes.schema
      : (sbApply || schemaRes?.schema || DEFAULT_APPLY_SCHEMA);
    applySchema = normalizeApplySchema(rawApply);

    renderStep1Fields();

    const params = new URLSearchParams(location.search);
    const paramPos = (params.get('posisi') || '').trim();
    const paramSrc = (params.get('sumber') || '').trim();

    if (paramPos && $('position')) {
      const matchedPos = activeVacancies.find(
        v => v.name.toLocaleLowerCase('id') === paramPos.toLocaleLowerCase('id')
      );
      if (matchedPos) $('position').value = matchedPos.name;
    }
    if (paramSrc && $('infoSource')) {
      const srcOpts = [...$('infoSource').options].map(o => o.value).filter(Boolean);
      const matchedSrc = srcOpts.find(src => src.toLocaleLowerCase('id') === paramSrc.toLocaleLowerCase('id'));
      if (matchedSrc) $('infoSource').value = matchedSrc;
    }

    renderDynamicFields();
  }

  function selectedVacancy() {
    const name = $('position')?.value || '';
    return activeVacancies.find(v => v.name === name) || null;
  }

  function renderDynamicFields() {
    const vacancy = selectedVacancy();
    const host = $('dynamicFields');
    if (!vacancy || !Array.isArray(vacancy.questions) || !vacancy.questions.length) {
      host.innerHTML = '';
      return;
    }

    host.innerHTML = vacancy.questions.map((q, idx) => {
      const fieldId = `q_input_${idx}`;
      const isReq = q.required !== false;
      const reqAttr = isReq ? 'required' : '';
      const reqMark = isReq ? '<span class="req-mark" aria-hidden="true">*</span>' : '';
      const qIdAttr = `data-q-id="${escapeHtml(q.id)}" data-q-type="${escapeHtml(q.type)}"`;

      if (q.type === 'dropdown') {
        const opts = (q.options || [])
          .map(opt => `<option value="${escapeHtml(opt.label)}">${escapeHtml(opt.label)}</option>`)
          .join('');
        return `<div class="field">
          <label for="${fieldId}">${escapeHtml(q.label)}${reqMark}</label>
          <select id="${fieldId}" ${qIdAttr} ${reqAttr}>
            <option value="">Pilih jawaban</option>
            ${opts}
          </select>
        </div>`;
      }

      if (q.type === 'radio') {
        const opts = (q.options || [])
          .map(opt => `<label class="opt">
            <input type="radio" name="${fieldId}" value="${escapeHtml(opt.label)}" data-q-id="${escapeHtml(q.id)}" data-q-required="${isReq ? 'true' : 'false'}">
            <span>${escapeHtml(opt.label)}</span>
          </label>`)
          .join('');
        return `<div class="field" data-q-radio-group="${escapeHtml(q.id)}" data-q-required="${isReq ? 'true' : 'false'}" data-q-label="${escapeHtml(q.label)}">
          <div class="legend">${escapeHtml(q.label)}${reqMark}</div>
          <div class="options">${opts}</div>
        </div>`;
      }

      if (q.type === 'checkbox') {
        const opts = (q.options || [])
          .map(opt => `<label class="opt">
            <input type="checkbox" name="${fieldId}" value="${escapeHtml(opt.label)}" data-q-id="${escapeHtml(q.id)}">
            <span>${escapeHtml(opt.label)}</span>
          </label>`)
          .join('');
        return `<div class="field" data-q-checkbox-group="${escapeHtml(q.id)}" data-q-required="${isReq ? 'true' : 'false'}" data-q-label="${escapeHtml(q.label)}">
          <div class="legend">${escapeHtml(q.label)}${reqMark}</div>
          <div class="options">${opts}</div>
        </div>`;
      }

      if (q.type === 'textarea') {
        return `<div class="field">
          <label for="${fieldId}">${escapeHtml(q.label)}${reqMark}</label>
          <textarea id="${fieldId}" ${qIdAttr} maxlength="1200" placeholder="${escapeHtml(q.placeholder || '')}" ${reqAttr}></textarea>
        </div>`;
      }

      if (q.type === 'number') {
        return `<div class="field">
          <label for="${fieldId}">${escapeHtml(q.label)}${reqMark}</label>
          <input id="${fieldId}" type="number" step="any" ${qIdAttr} placeholder="${escapeHtml(q.placeholder || '')}" ${reqAttr}>
        </div>`;
      }

      return `<div class="field">
        <label for="${fieldId}">${escapeHtml(q.label)}${reqMark}</label>
        <input id="${fieldId}" type="text" ${qIdAttr} maxlength="180" placeholder="${escapeHtml(q.placeholder || '')}" ${reqAttr}>
      </div>`;
    }).join('');
  }

  function currentStepValid() {
    const stepEl = steps[current];
    const fields = [...stepEl.querySelectorAll('input,select,textarea')].filter(
      el => !el.disabled && el.offsetParent !== null && el.type !== 'radio' && el.type !== 'checkbox'
    );
    for (const el of fields) {
      if (!el.checkValidity()) {
        el.reportValidity();
        return false;
      }
    }

    const radioGroups = [...stepEl.querySelectorAll('[data-q-radio-group]')];
    for (const group of radioGroups) {
      if (group.dataset.qRequired === 'true' && !group.querySelector('input[type="radio"]:checked')) {
        showError(`Pilih salah satu jawaban untuk "${group.dataset.qLabel || 'pertanyaan'}".`);
        return false;
      }
    }

    const checkboxGroups = [...stepEl.querySelectorAll('[data-q-checkbox-group]')];
    for (const group of checkboxGroups) {
      if (group.dataset.qRequired === 'true' && !group.querySelector('input[type="checkbox"]:checked')) {
        showError(`Pilih minimal satu jawaban untuk "${group.dataset.qLabel || 'pertanyaan'}".`);
        return false;
      }
    }

    const confirmBox = stepEl.querySelector('#confirm');
    if (confirmBox && !confirmBox.checkValidity()) {
      confirmBox.reportValidity();
      return false;
    }

    return true;
  }

  function showStep(index) {
    current = index;
    steps.forEach((s, i) => s.classList.toggle('hidden', i !== index));
    $('stepLabel').textContent = steps[index].dataset.title;
    $('stepCount').textContent = (index + 1) + ' / ' + steps.length;
    $('progressBar').style.width = ((index + 1) / steps.length * 100) + '%';
    $('backBtn').classList.toggle('hidden', index === 0);
    $('nextBtn').classList.toggle('hidden', index === steps.length - 1);
    $('submitBtn').classList.toggle('hidden', index !== steps.length - 1);
    $('errorBox').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('nextBtn').addEventListener('click', () => {
    if (!currentStepValid()) return;
    if (current === 0 && !$('position')?.value) { showError('Pilih posisi yang dilamar.'); return; }
    const infoEl = $('infoSource');
    if (current === 0 && infoEl && infoEl.required && !infoEl.value) { showError('Pilih sumber informasi.'); return; }
    showStep(current + 1);
  });
  $('backBtn').addEventListener('click', () => showStep(current - 1));

  $('confirm').addEventListener('change', () => {
    if ($('confirm').checked) {
      if (!$('cv').files[0]) {
        showError('Unggah CV terlebih dahulu.');
        $('confirm').checked = false;
        return;
      }
      form.requestSubmit();
    }
  });

  function showError(msg) {
    $('errorBox').textContent = msg;
    $('errorBox').style.display = 'block';
  }

  function collectDetails(vacancy) {
    const details = {};

    const step1Host = $('step1Fields');
    for (const f of applySchema.fields || []) {
      if (f.system || f.enabled === false) continue;
      if (f.type === 'checkbox') {
        details[f.id] = [...step1Host.querySelectorAll(`input[type="checkbox"][data-s1-id="${CSS.escape(f.id)}"]:checked`)].map(el => el.value);
      } else if (f.type === 'radio') {
        const checked = step1Host.querySelector(`input[type="radio"][data-s1-id="${CSS.escape(f.id)}"]:checked`);
        details[f.id] = checked ? checked.value : '';
      } else {
        const el = step1Host.querySelector(`[data-s1-id="${CSS.escape(f.id)}"]`);
        details[f.id] = el ? el.value.trim() : '';
      }
    }

    if (!vacancy) return details;
    const host = $('dynamicFields');
    for (const q of vacancy.questions || []) {
      if (q.type === 'checkbox') {
        details[q.id] = [...host.querySelectorAll(`input[type="checkbox"][data-q-id="${CSS.escape(q.id)}"]:checked`)].map(el => el.value);
      } else if (q.type === 'radio') {
        const checked = host.querySelector(`input[type="radio"][data-q-id="${CSS.escape(q.id)}"]:checked`);
        details[q.id] = checked ? checked.value : '';
      } else {
        const el = host.querySelector(`[data-q-id="${CSS.escape(q.id)}"]`);
        details[q.id] = el ? el.value.trim() : '';
      }
    }
    return details;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!currentStepValid()) {
      $('confirm').checked = false;
      return;
    }
    const file = $('cv').files[0];
    if (!file) { showError('Silakan unggah CV.'); $('confirm').checked = false; return; }
    if (file.size > 5 * 1024 * 1024) { showError('Ukuran CV maksimal 5 MB.'); $('confirm').checked = false; return; }
    const allowed = [
      'application/pdf',
      'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    ];
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const isValidCv = allowed.includes(file.type) || ['pdf', 'doc', 'docx'].includes(ext);
    if (!isValidCv) { showError('Format CV harus PDF, DOC, atau DOCX.'); $('confirm').checked = false; return; }
    if (!$('confirm').checked) { showError('Centang konfirmasi kebenaran data.'); return; }

    $('submitBtn').disabled = true;
    $('submitBtn').textContent = 'Mengirim...';
    $('confirm').disabled = true;
    $('errorBox').style.display = 'none';
    try {
      const vacancy = selectedVacancy();
      const city = $('city')?.value || '';
      const district = city === 'Area lain' ? ($('districtOther')?.value.trim() || '') : ($('district')?.value || '');
      const details = collectDetails(vacancy);
      const source = $('infoSource')?.value || '';
      const scoring = calculateCandidateScore(vacancy || { name: $('position').value }, city, district, details);

      const payload = {
        position: $('position').value,
        source,
        name: $('name').value.trim(),
        city,
        district,
        whatsapp: $('whatsapp')?.value.trim() || '',
        details
      };
      if (payload.name.length < 2) {
        throw new Error('Nama lengkap minimal 2 karakter.');
      }

      const { supabase } = await import('../assets/js/supabase.js?v=20261122-lowongan-v5');
      if (!supabase) throw new Error('Server belum terhubung.');
      const safeExt = ['pdf', 'doc', 'docx'].includes(ext) ? ext : 'pdf';
      const id = crypto.randomUUID();
      const path = `stage1-cv/${id}/cv.${safeExt}`;
      const { error: uploadError } = await supabase.storage
        .from('candidate-stage1-cv')
        .upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
      if (uploadError) throw uploadError;

      const { error: insertError } = await supabase.from('candidate_stage1_applications').insert({
        position: payload.position,
        full_name: payload.name,
        city: payload.city || '',
        district: payload.district || '',
        whatsapp: payload.whatsapp || '',
        source: payload.source || '',
        recommendation: scoring.recommendation,
        recommendation_notes: `Skor otomatis tahap 1: ${scoring.percentageScore}/100 (${scoring.totalScore}/${scoring.maxScore})`,
        experience_details: {
          ...payload.details,
          ...(payload.source ? { sumber_informasi: payload.source } : {}),
          _scoring: scoring
        },
        cv_path: path,
        cv_filename: file.name,
        status: 'received'
      });
      if (insertError) throw insertError;

      let whatsappUrl = '';
      if (scoring.recommended) {
        let cvUrl = '';
        try {
          const { data: signedData, error: signedError } = await supabase.storage
            .from('candidate-stage1-cv')
            .createSignedUrl(path, 604800);
          if (signedError) throw signedError;
          cvUrl = signedData?.signedUrl || '';
        } catch (linkError) {
          console.warn('Tautan CV WhatsApp tidak berhasil dibuat:', linkError);
        }
        whatsappUrl = buildStage1WhatsAppUrl(payload, vacancy, scoring, file.name, cvUrl, id);
      }

      showResult({
        recommended: scoring.recommended,
        whatsappUrl
      });
    } catch (err) {
      showError(err.message || 'File gagal diproses.');
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = 'Kirim lamaran';
      $('confirm').disabled = false;
      $('confirm').checked = false;
    }
  });

  function showResult(res) {
    $('formArea').classList.add('hidden');
    $('resultArea').classList.remove('hidden');
    $('resultSymbol').textContent = '✓';
    $('resultTitle').textContent = 'Lamaran berhasil dikirim';

    if (res?.recommended && res?.whatsappUrl) {
      $('resultStatus').textContent = 'DIREKOMENDASIKAN';
      $('resultMessage').textContent = 'Anda memenuhi kriteria awal. Silakan lanjutkan konfirmasi ke WhatsApp HR.';
      $('waLink').href = res.whatsappUrl;
      $('waLink').textContent = 'Konfirmasi ke WhatsApp HR · 08133193313';
      $('waLink').classList.remove('hidden');
    } else {
      $('resultStatus').textContent = 'DATA TERSIMPAN';
      $('resultMessage').textContent = 'Data lamaran Anda sudah tersimpan.';
      $('waLink').removeAttribute('href');
      $('waLink').classList.add('hidden');
    }
  }

  await loadVacanciesAndSchema();
  document.documentElement.dataset.applyReady = 'true';
  showStep(0);
</script></body></html>
