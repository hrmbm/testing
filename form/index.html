<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0D5C6B">
  <meta name="pk-build" content="20261122-hrga-workspace-16">
  <title>Application Form | HR&amp;GA Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://osjikdsebniwnzancsjl.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/app.css?v=20261122-hrga-workspace-16">
  <link rel="stylesheet" href="../assets/css/mitra-theme.css?v=20261122-hrga-workspace-16">
</head>
<body class="candidate-page">
  <header class="candidate-topbar">
    <div class="candidate-topbar-inner">
      <div class="candidate-topbar-brand">
        <img class="brand-logo brand-logo-dark" src="../assets/img/logo-mitra.png" alt="PT. Mitra Binamandiri Makmur">
        <span>HR&amp;GA Workspace</span>
      </div>
      <span class="candidate-topbar-meta">Candidate Form · Stage 2</span>
    </div>
  </header>
  <main class="candidate-wrap">
    <div id="candidate-app" class="candidate-content"></div>
  </main>
  <script type="module">
    const BUILD = '20261122-hrga-workspace-16';
    const BUILD_KEY = 'portal-karir-static-build';
    const APP_CACHE_PREFIXES = ['hrga-workspace-app-assets-', 'hrga-workspace-app-shell-', 'portal-karir-app-assets-', 'portal-karir-app-shell-'];

    // Run before applicant.js: remove stale UI caches on a build change while
    // preserving candidate drafts, region catalog cache, and the current OCR
    // model cache (that cache prevents another first-run model download).
    try {
      const previous = localStorage.getItem(BUILD_KEY);
      if (previous !== BUILD) {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names
            .filter(name => APP_CACHE_PREFIXES.some(prefix => name.startsWith(prefix)) && name !== `hrga-workspace-app-assets-${BUILD}`)
            .map(name => caches.delete(name)));
          await caches.delete('portal-karir-ocr-models-v2');
        }
        localStorage.setItem(BUILD_KEY, BUILD);
      }
    } catch (error) {
      console.warn('Old application cache cleanup skipped:', error);
    }

    // Upgrade any previous worker for this project scope. The current worker
    // always fetches navigation HTML from network with cache:no-store, and its
    // controller change triggers one clean reload into the new build.
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      const reloadKey = `portal-karir-sw-reloaded-${BUILD}`;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (sessionStorage.getItem(reloadKey) !== '1') {
          sessionStorage.setItem(reloadKey, '1');
          location.reload();
        }
      });
      try {
        const workerUrl = new URL('../sw.js?v=' + BUILD, location.href);
        const scope = new URL('../', location.href).pathname;
        const registration = await navigator.serviceWorker.register(workerUrl.href, { scope, updateViaCache: 'none' });
        registration.update().catch(() => {});
        if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      } catch (error) {
        console.warn('Service worker update unavailable:', error);
      }
    }

    await import(`../assets/js/applicant.js?v=${BUILD}`);
  </script>
</body>
</html>
