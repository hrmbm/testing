        <form id="login-form" autocomplete="on">

  <script type="module">
    const BUILD = '20261124-hrga-workspace-22';
    const BUILD_KEY = 'portal-karir-static-build';
    const APP_CACHE_PREFIXES = ['hrga-workspace-app-assets-', 'hrga-workspace-app-shell-', 'portal-karir-app-assets-', 'portal-karir-app-shell-'];

    try {
      const bootUrl = new URL(location.href);
      if (bootUrl.searchParams.has('_fresh')) {
        bootUrl.searchParams.delete('_fresh');
        history.replaceState(null, '', bootUrl.pathname + bootUrl.search + bootUrl.hash);
      }
      const previous = localStorage.getItem(BUILD_KEY);
      if (previous !== BUILD) {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names
            .filter(name => APP_CACHE_PREFIXES.some(prefix => name.startsWith(prefix)) && name !== `hrga-workspace-app-assets-${BUILD}`)
            .map(name => caches.delete(name)));
        }
        // Burn persistent cache & force re-login whenever application version updates
        if (previous) {
          localStorage.removeItem('hrga_session_profile_v1');
          Object.keys(localStorage)
            .filter(k => k.startsWith('sb-') && k.includes('auth-token'))
            .forEach(k => localStorage.removeItem(k));
          if (typeof indexedDB !== 'undefined') {
            await new Promise(resolve => {
              try {
                const req = indexedDB.deleteDatabase('hrga-workspace-cache-db');
                req.onsuccess = () => resolve();
                req.onerror = () => resolve();
                req.onblocked = () => resolve();
              } catch {
                resolve();
              }
            });
          }
        }
        localStorage.setItem(BUILD_KEY, BUILD);
      }
    } catch {}

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      try {
        const workerUrl = new URL('./sw.js?v=' + BUILD, location.href);
        const scope = new URL('./', location.href).pathname;
        const registration = await navigator.serviceWorker.register(workerUrl.href, { scope, updateViaCache: 'none' });
        registration.update().catch(() => {});
        if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      } catch {}
    }

    document.getElementById('login-form')?.addEventListener('submit', event => event.preventDefault());
    await import(`./assets/js/admin.js?v=${BUILD}`);
  </script>
